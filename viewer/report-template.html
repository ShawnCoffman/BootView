<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BootView</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --wash: rgba(11,11,11,.05);
    --s0: #e34948; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --other: #b8b6ad;
    --critical: #d03b3b; --warning: #fab219; --good: #0ca30c;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.06);
      --s0: #e66767; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --other: #55544f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.06);
    --s0: #e66767; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --other: #55544f;
  }

  * { box-sizing: border-box; }
  html { background: var(--page); }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }

  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  .device { color: var(--ink2); font-size: 13px; margin-top: 2px; }
  .btn { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
  .btn:hover { background: var(--wash); }
  .btn:focus-visible, .col:focus-visible, tr[tabindex]:focus-visible, select:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }

  .notice { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--s4); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; color: var(--ink2); }
  .notice strong { color: var(--ink); }
  code { font: 12.5px ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--wash); padding: 1px 5px; border-radius: 4px; }

  .filters { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 16px; }
  .filters label, .ctl label { color: var(--ink2); font-size: 12px; display: block; margin-bottom: 3px; }
  .seg { display: inline-flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { font: inherit; background: none; border: 0; color: var(--ink2); padding: 5px 12px; cursor: pointer; border-right: 1px solid var(--border); }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { background: var(--wash); }
  .seg button[aria-pressed="true"] { color: var(--ink); font-weight: 650; background: var(--wash); }
  .seg button[aria-pressed="true"]::before { content: "✓ "; }
  .seg button:focus-visible { outline: 2px solid var(--s1); outline-offset: -2px; }
  .seg.small button { padding: 2px 9px; font-size: 12.5px; }
  select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
  .card h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .card .sub { color: var(--ink2); font-size: 12.5px; margin: 2px 0 12px; }
  .cardhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 16px; }
  .grid { display: grid; gap: 16px; }
  .kpis { grid-template-columns: 1.6fr repeat(4, 1fr); margin-bottom: 16px; }
  .cards { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); margin-top: 16px; }
  .cards .wide { grid-column: 1 / -1; }
  .cards .wide .row { grid-template-columns: minmax(140px, 280px) 1fr auto; }
  @media (max-width: 960px) { .kpis { grid-template-columns: 1fr 1fr; } .kpis .hero { grid-column: 1 / -1; } }
  @media (max-width: 460px) { .cards { grid-template-columns: 1fr; } .kpis { grid-template-columns: 1fr; } }
  @media (max-width: 560px) {                       /* phone: bar goes under its label so it keeps a usable width */
    .row, .cards .wide .row { grid-template-columns: 1fr auto; row-gap: 3px; padding: 3px 0; }
    .row .name { grid-column: 1; grid-row: 1; }
    .row .val { grid-column: 2; grid-row: 1 / span 2; align-self: start; }
    .row .track { grid-column: 1; grid-row: 2; }
    .row.hdr, .cards .wide .row.hdr { grid-template-columns: 1fr; padding: 0; }
    .row.hdr > div:first-child, .row.hdr .val { display: none; }
    .row.hdr .axis { grid-column: 1; grid-row: 1; }
  }

  .tile .label { color: var(--ink2); font-size: 12.5px; }
  .tile .value { font-size: 28px; font-weight: 650; letter-spacing: -.01em; line-height: 1.15; margin-top: 4px; }
  .tile .meta { color: var(--ink2); font-size: 12.5px; margin-top: 4px; }
  .hero .value { font-size: 56px; line-height: 1.05; }
  button.link { font: inherit; padding: 0; background: none; border: 0; color: var(--ink2); text-decoration: underline; cursor: pointer; text-align: left; }

  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 8px; padding: 0; list-style: none; color: var(--ink2); font-size: 12.5px; }
  .legend li { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
  .p-firmware { background: var(--s0); fill: var(--s0); }
  .p-boot { background: var(--s1); fill: var(--s1); } .p-machinePolicy { background: var(--s2); fill: var(--s2); }
  .p-auth { background: var(--s3); fill: var(--s3); } .p-profile { background: var(--s4); fill: var(--s4); }
  .p-userPolicy { background: var(--s5); fill: var(--s5); } .p-logonTasks { background: var(--s6); fill: var(--s6); }
  .p-other { background: var(--other); fill: var(--other); }
  .p-signInWait { background: repeating-linear-gradient(135deg, var(--other) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--other); fill: url(#hatch); }

  #chart { position: relative; }
  #chart svg { display: block; width: 100%; overflow: visible; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .baseline { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 11px; }
  .refline { stroke: var(--ink2); stroke-width: 1; }
  .reflabel, .maxlabel { fill: var(--ink); font-size: 11.5px; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
  .col { cursor: pointer; outline: none; }
  .col .hit { fill: transparent; }
  .col .selwash { fill: var(--wash); opacity: 0; }
  .col.sel .selwash { opacity: 1; }
  .hovering .col:not(.hover) .bars { opacity: .45; }
  .col.hover .selwash, .col:focus-visible .selwash { opacity: 1; }
  .tip { position: absolute; pointer-events: none; z-index: 5; min-width: 200px; max-width: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,.18); font-size: 12.5px; display: none; }
  .tip .t { font-weight: 650; margin-bottom: 4px; }
  .tip .t small { font-weight: 400; color: var(--ink2); }
  .tip .r { display: flex; align-items: center; gap: 8px; padding: 1px 0; }
  .tip .k { width: 12px; height: 6px; border-radius: 2px; flex: none; }
  .tip .v { font-weight: 650; min-width: 54px; }
  .tip .n { color: var(--ink2); }
  .tip .tot { border-top: 1px solid var(--grid); margin-top: 4px; padding-top: 4px; }

  .detailhead { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; }
  .badge { display: inline-block; font-size: 11.5px; font-weight: 400; padding: 1px 8px; border: 1px solid var(--border); border-radius: 999px; color: var(--ink2); margin-left: 8px; vertical-align: 2px; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--ink2); font-size: 12.5px; margin-top: 6px; }
  .facts b { color: var(--ink); font-weight: 650; }
  .strip { display: flex; height: 28px; margin: 12px 0 4px; }
  .strip > div { margin-right: 2px; position: relative; min-width: 1px; }
  .strip > div:first-child { border-radius: 4px 0 0 4px; } .strip > div:last-child { border-radius: 0 4px 4px 0; margin-right: 0; }
  .strip span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .empty { color: var(--ink2); font-style: italic; margin: 4px 0 0; }

  .rows { display: grid; gap: 2px; }
  .row { display: grid; grid-template-columns: minmax(90px, 200px) 1fr auto; align-items: center; gap: 10px; min-height: 24px; }
  .row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .row .name.indent { padding-left: 14px; color: var(--ink2); }
  .row .track { position: relative; height: 10px; }
  .row .bar { position: absolute; top: 0; height: 10px; min-width: 2px; }
  .row .bar.rank { left: 0; border-radius: 0 4px 4px 0; }
  .row .bar.span { border-radius: 3px; }
  .row .bar.clip { border-radius: 3px 0 0 3px; }
  .row .mark { position: absolute; top: -3px; width: 2px; height: 16px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
  .row .mark.bad { background: var(--critical); }
  .row .val { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 650; min-width: 74px; }
  .row .val small { display: block; font-weight: 400; color: var(--ink2); font-size: 11px; line-height: 1.1; }
  .row.hdr { min-height: 18px; }
  .grp { grid-column: 1 / -1; font-size: 12px; font-weight: 650; color: var(--ink2); text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 2px; border-bottom: 1px solid var(--grid); padding-bottom: 2px; }
  .grp:first-child { margin-top: 0; }
  .axis { position: relative; height: 16px; color: var(--muted); font-size: 11px; }
  .axis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .axis span:first-child { transform: none; }
  .grid-bg { background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px); background-repeat: repeat-x; }
  .slow { color: var(--ink); font-weight: 650; }
  .note { color: var(--ink2); font-size: 12px; margin-top: 8px; }
  .status { font-size: 11.5px; font-weight: 650; white-space: nowrap; }
  .status.bad { color: var(--critical); } .status.warn { color: var(--ink); }
  .status.bad::before { content: "✕ "; } .status.warn::before { content: "▲ "; color: var(--warning); }
  dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 0 0 10px; }
  dl.kv dt { color: var(--ink2); } dl.kv dd { margin: 0; font-weight: 650; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
  .h3 { font-size: 12.5px; color: var(--ink2); font-weight: 650; margin: 12px 0 4px; }
  .run { border-top: 1px solid var(--grid); padding-top: 8px; margin-top: 10px; }
  .run:first-of-type { border-top: 0; }
  .run .title { font-weight: 650; }
  .run .meta { color: var(--ink2); font-size: 12px; margin: 1px 0 6px; }
  ul.list { margin: 4px 0 0; padding-left: 18px; color: var(--ink2); font-size: 12.5px; }
  ul.list li { margin: 2px 0; overflow-wrap: anywhere; }
  ul.list li b { color: var(--ink); font-weight: 650; }

  .tablewrap { max-height: 420px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { padding: 5px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  thead th { position: sticky; top: 0; background: var(--surface); color: var(--ink2); font-weight: 650; z-index: 1; border-bottom: 1px solid var(--axis); }
  #table tbody tr { cursor: pointer; }
  #table tbody tr:hover { background: var(--wash); }
  #table tbody tr.sel { background: var(--wash); font-weight: 650; }
  td { font-variant-numeric: tabular-nums; }
  td.l { text-align: left; white-space: normal; overflow-wrap: anywhere; }
  footer { margin-top: 24px; color: var(--ink2); font-size: 12px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><rect width="2" height="5" style="fill:var(--other)"></rect></pattern></defs>
</svg>
<div class="wrap">
  <header>
    <div>
      <h1>BootView</h1>
      <div class="device" id="device"></div>
    </div>
    <button class="btn" id="theme" type="button" title="Switch colour theme">Theme: auto</button>
  </header>

  <div id="notices"></div>

  <div class="filters" id="filters">
    <div><label>Range</label><div class="seg" id="f-range" role="group" aria-label="Range"></div></div>
    <div><label for="f-type">Boot type</label><select id="f-type"></select></div>
    <div><label>Timeline</label><div class="seg" id="f-view" role="group" aria-label="Timeline"></div></div>
    <div><label>Sign-in screen wait</label><div class="seg" id="f-wait" role="group" aria-label="Sign-in screen wait"></div></div>
  </div>

  <div id="content">
    <div class="grid kpis" id="kpis"></div>

    <section class="card" aria-labelledby="chart-h">
      <h2 id="chart-h">Where each boot's time goes</h2>
      <p class="sub" id="chart-sub"></p>
      <ul class="legend" id="legend"></ul>
      <div id="chart"></div>
    </section>

    <section class="card" style="margin-top:16px" aria-labelledby="detail-h" id="detail"></section>

    <section class="card" style="margin-top:16px" aria-labelledby="typ-h" id="typical"></section>

    <section class="card" style="margin-top:16px" aria-labelledby="table-h">
      <div class="cardhead">
        <div><h2 id="table-h">All boots</h2><p class="sub">Same data as the chart, as a table. Select a row to inspect that boot.</p></div>
        <button class="btn" id="csv" type="button">Download CSV</button>
      </div>
      <div class="tablewrap"><table id="table"></table></div>
    </section>
  </div>

  <footer id="foot"></footer>
</div>

<script id="bootview-data" type="application/json">__BOOTVIEW_DATA__</script>
<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------ data
  var DATA;
  try { DATA = JSON.parse(document.getElementById('bootview-data').textContent); } catch (e) { DATA = null; }
  if (!DATA || !DATA.boots) {
    document.getElementById('content').replaceChildren(el('p', { class: 'empty' }, 'No data embedded. Run Collect-BootData.ps1 to generate a report.'));
    return;
  }

  var PHASES = [
    { key: 'firmware',      label: 'Firmware + boot loader', hint: 'UEFI/BIOS POST (Task Manager’s “Last BIOS time”), then Windows Boot Manager and the OS loader, including any BitLocker PIN entry.' },
    { key: 'boot',          label: 'Windows boot',           hint: 'Kernel start until the sign-in screen is ready (Winlogon finished its startup notifications).' },
    { key: 'machinePolicy', label: 'Computer policy',        hint: 'Time Winlogon waited for computer Group Policy at startup (synchronous processing only).' },
    { key: 'signInWait',    label: 'Sign-in screen wait',    hint: 'The sign-in screen was ready and waiting for the user. Not a performance problem; excluded unless included above.' },
    { key: 'auth',          label: 'Authentication',         hint: 'Winlogon authentication.' },
    { key: 'profile',       label: 'Profile load',           hint: 'User Profile Service logon processing.' },
    { key: 'userPolicy',    label: 'User policy',            hint: 'Time sign-in waited for user Group Policy (synchronous processing only).' },
    { key: 'logonTasks',    label: 'Logon tasks',            hint: 'Shell logon tasks (AllLogonTasks) until the desktop is ready.' },
    { key: 'other',         label: 'Other / unattributed',   hint: 'Time between measured steps after sign-in.' }
  ];
  var VIEWS = {
    power: { label: 'Power-on → ready', sub: 'Power-on to desktop ready' },
    boot:  { label: 'Windows start → ready', sub: 'Windows kernel start to desktop ready (excludes firmware)' },
    logon: { label: 'Sign-in → ready', sub: 'Authentication to desktop ready' }
  };
  var LOGON_KEYS = { auth: 1, profile: 1, userPolicy: 1, logonTasks: 1, other: 1 };
  var BOOT_TYPES = { 0: 'Full boot', 1: 'Fast startup', 2: 'Hibernate resume' };
  var WINLOGON_SHOWN = { 0: 1, 2: 1, 12: 1, 4: 1, 5: 1 };
  var SRC = DATA.sources || {};
  var DEV = DATA.device || {};

  var boots = DATA.boots.slice().sort(function (a, b) { return a.bootStartMs - b.bootStartMs; });
  var latestMs = boots.length ? boots[boots.length - 1].bootStartMs : 0;
  var hasFirmware = boots.some(function (b) { return b.totals && isNum(b.totals.firmwareMs); });
  var state = { range: 30, type: 'all', view: hasFirmware ? 'power' : 'boot', wait: false, selected: null, wf: 'ready', typ: 'phases' };

  // ------------------------------------------------------------------ helpers
  function el(tag, props) {
    var node = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === 'class') node.className = v;
      else if (k === 'style') node.style.cssText = v;
      else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) append(node, arguments[i]);
    return node;
  }
  function append(node, kid) {                       // data is untrusted: only ever text nodes, never innerHTML
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(function (k) { append(node, k); }); return; }
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function svg(tag, props) {
    var node = document.createElementNS(SVGNS, tag);
    if (props) Object.keys(props).forEach(function (k) { if (props[k] != null) node.setAttribute(k, props[k]); });
    for (var i = 2; i < arguments.length; i++) append(node, arguments[i]);
    return node;
  }
  function $(id) { return document.getElementById(id); }
  function arr(x) { return Array.isArray(x) ? x : (x == null ? [] : [x]); }   // 1-item lists can arrive as scalars from older data

  function fmt(ms) {
    if (ms == null || isNaN(ms)) return '–';
    if (Math.abs(ms) < 1000) return Math.round(ms) + ' ms';
    var s = ms / 1000;
    if (Math.abs(s) < 60) return s.toFixed(Math.abs(s) < 10 ? 2 : 1) + ' s';
    var m = Math.floor(s / 60);
    if (m < 60) return m + 'm ' + Math.round(s - m * 60) + 's';
    return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
  }
  function fmtShort(ms) { return ms == null || isNaN(ms) ? '–' : (ms / 1000).toFixed(1) + ' s'; }
  function median(a) { a = a.filter(isNum).sort(function (x, y) { return x - y; }); if (!a.length) return null; var m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; }
  function pct(a, p) { a = a.filter(isNum).sort(function (x, y) { return x - y; }); if (!a.length) return null; return a[Math.min(a.length - 1, Math.ceil(p * a.length) - 1)]; }
  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  function dt(ms) { return new Date(ms); }
  function dateLabel(ms) { return dt(ms).toLocaleDateString(undefined, { month: 'numeric', day: 'numeric' }); }
  function dateLong(ms) { return dt(ms).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
  function niceStep(max, count) {
    if (!(max > 0)) return 1;
    var raw = max / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
  }
  function phaseMs(b, key) { return (b.phases || []).reduce(function (s, p) { return s + (p.key === key ? p.durMs : 0); }, 0); }
  function bootTypeName(t) { return BOOT_TYPES[t] || 'Unknown type'; }
  function label(key) { var p = PHASES.filter(function (x) { return x.key === key; })[0]; return p ? p.label : key; }
  function hex(n) { return isNum(n) ? '0x' + (n >>> 0).toString(16).toUpperCase() : n; }
  function sumBy(a, f) { return a.reduce(function (s, x) { var v = f(x); return s + (isNum(v) ? v : 0); }, 0); }

  var measureCtx = document.createElement('canvas').getContext('2d');
  function textW(str, font) { measureCtx.font = font || '600 11.5px system-ui, "Segoe UI", sans-serif'; return measureCtx.measureText(str).width; }

  // ------------------------------------------------------------------ filtering
  function visible() {
    var min = state.range ? latestMs - state.range * 86400000 : -Infinity;
    return boots.filter(function (b) {
      if (b.bootStartMs < min) return false;
      if (state.type !== 'all' && b.bootType !== Number(state.type)) return false;
      return true;
    });
  }
  // only boots whose logon completed (AllLogonTasks finished) are charted, so chart and KPI tiles describe the same set

      el('p', { class: 'sub' }, 'What requested the shutdown or restart, and how long shutting down took.'));
    var r = b.shutdownReason, sp = b.shutdownPerf, kv = [];
    if (b.shutdownMs) kv.push(el('dt', null, 'Up for'), el('dd', null, fmt(b.shutdownMs - b.bootStartMs)));
    if (r) {
      kv.push(el('dt', null, 'Requested by'), el('dd', null, (r.process || '').split('\\').pop() || '–'));
      kv.push(el('dt', null, 'Type'), el('dd', null, r.type || '–'));
      kv.push(el('dt', null, 'Reason'), el('dd', null, (r.reason || '–') + (r.comment ? ' – ' + r.comment : '')));
      if (r.user) kv.push(el('dt', null, 'User'), el('dd', null, r.user));
    }
    if (sp) {
      kv.push(el('dt', null, 'Shutdown took'), el('dd', null, fmt(sp.totalMs)));
    }
    if (kv.length) card.append(el('dl', { class: 'kv' }, kv));
    if (sp && sp.fields) {
      var f = sp.fields, names = { ShutdownUserSessionTime: 'User session', ShutdownUserPolicyTime: 'User policy', ShutdownUserProfilesTime: 'User profiles',
        ShutdownSystemSessionsTime: 'System sessions', ShutdownPreShutdownNotificationsTime: 'Pre-shutdown notifications', ShutdownServicesTime: 'Services', ShutdownKernelTime: 'Kernel' };
      var items = Object.keys(names).filter(function (k) { return f[k] > 0; }).map(function (k) { return { name: names[k], ms: f[k] }; }).sort(function (a, c) { return c.ms - a.ms; });
      if (items.length) card.append(el('div', { class: 'h3' }, 'Shutdown components'), rankRows(items, 'p-other'));
      var dg = degraderItems(sp.degraders);
      if (dg.length) card.append(el('div', { class: 'h3' }, 'What slowed shutdown'), rankRows(dg, 'p-other'));
    }
    var wl = arr(b.winlogon).filter(function (w) { return !WINLOGON_SHOWN[w.event] && w.durMs >= 5; }).sort(function (a, c) { return c.durMs - a.durMs; }).slice(0, 5);
    if (wl.length) card.append(el('div', { class: 'h3' }, 'Winlogon at sign-out / shutdown'), rankRows(wl.map(function (w) { return { name: w.subscriber + ' · ' + w.eventName, ms: w.durMs }; }), 'p-other'));
    if (!kv.length && !wl.length) card.append(el('p', { class: 'empty' }, b.shutdownMs ? 'No shutdown request recorded.' : 'Still running, or ended without a clean shutdown.'));
    return card;
  }

  function issuesCard(b) {
    var card = el('section', { class: 'card' }, el('h2', null, 'Problems around this boot'),
      el('p', { class: 'sub' }, 'Services that failed or timed out, drivers that did not load, unexpected shutdowns and Entra ID token errors – within ' + (DEV.windowMinutes || 15) + ' minutes of boot or sign-in.'));
    var xs = arr(b.issues);
    var fw = b.firmware || {};
    var li = [];
    if (fw.lastShutdownGood === false) li.push(el('li', null, statusEl('bad', 'Power'), ' The previous shutdown was not clean.'));
    xs.forEach(function (x) { li.push(el('li', null, statusEl('bad', x.source + ' ' + x.id), ' ', el('b', null, '+' + fmtShort(x.t - b.bootStartMs) + ' '), x.text)); });
    card.append(li.length ? el('ul', { class: 'list' }, li) : el('p', { class: 'empty' }, 'None recorded.'));
    return card;
  }

  function renderDetail(list) {
    var host = $('detail'); host.replaceChildren();
    var b = boots.filter(function (x) { return x.id === state.selected; })[0];
    if (!b) { host.append(el('h2', { id: 'detail-h' }, 'Boot detail'), el('p', { class: 'empty' }, 'Select a boot to see its breakdown.')); return; }
    var t = b.totals || {}, lg = b.logon || {};
    host.append(el('div', { class: 'detailhead' },
      el('h2', { id: 'detail-h' }, dateLong(b.bootStartMs), el('span', { class: 'badge' }, bootTypeName(b.bootType)),
        b.firmware && b.firmware.lastShutdownGood === false ? el('span', { class: 'badge' }, 'after an unclean shutdown') : null),
      el('div', { class: 'sub', style: 'margin:0' }, b.shutdownMs ? 'Up for ' + fmt(b.shutdownMs - b.bootStartMs) : 'Still running, or shut down uncleanly')));
    var facts = [];
    if (lg.user && lg.user.name) facts.push(el('span', null, 'Signed in: ', el('b', null, lg.user.name), lg.user.profileType && lg.user.profileType !== 'Regular' ? ' (' + lg.user.profileType + ' profile)' : ''));
    if (isNum(t.powerOnToReadyMs)) facts.push(el('span', null, 'Power-on → ready: ', el('b', null, fmt(t.powerOnToReadyMs))));
    if (isNum(t.coreBootMs)) facts.push(el('span', null, 'To sign-in screen: ', el('b', null, fmt(t.coreBootMs))));
    if (isNum(t.signInWaitMs)) facts.push(el('span', null, 'Screen waited: ', el('b', null, fmt(t.signInWaitMs))));
    if (isNum(t.signInToReadyMs)) facts.push(el('span', null, 'Sign-in → ready: ', el('b', null, fmt(t.signInToReadyMs))));
    if (isNum(t.networkMs)) facts.push(el('span', null, 'Network at: ', el('b', null, '+' + fmtShort(t.networkMs))));
    if (b.shutdownReason && b.shutdownReason.process) facts.push(el('span', null, 'Ended by: ', el('b', null, b.shutdownReason.process.split('\\').pop()), b.shutdownReason.type ? ' (' + b.shutdownReason.type + ')' : ''));
    if (facts.length) host.append(el('div', { class: 'facts' }, facts));

    // proportional strip with direct labels only where they fit
    var phases = (b.phases || []).filter(function (p) { return p.durMs > 0; });
    if (phases.length) {
      var totalMs = phases.reduce(function (s, p) { return s + p.durMs; }, 0);
      var stripW = Math.max(320, host.clientWidth - 32);
      var strip = el('div', { class: 'strip', role: 'img', 'aria-label': phases.map(function (p) { return label(p.key) + ' ' + fmt(p.durMs); }).join(', ') });
      phases.forEach(function (p) {
        var w = p.durMs / totalMs * stripW, text = label(p.key) + ' ' + fmtShort(p.durMs);
        var fits = w >= textW(text) + 16;
        var seg = el('div', { class: 'p-' + p.key, style: 'width:' + (p.durMs / totalMs * 100) + '%', title: label(p.key) + ': ' + fmt(p.durMs) });
        // white text on the deep red / blue / green fills; dark ink on the lighter hues; theme ink on the neutral fills
        var ink = (p.key === 'boot' || p.key === 'logonTasks' || p.key === 'firmware') ? '#fff' : (p.key === 'other' || p.key === 'signInWait') ? 'var(--ink)' : '#0b0b0b';
        if (fits) seg.append(el('span', { style: 'color:' + ink }, text));
        strip.append(seg);
      });
      host.append(strip, el('div', { class: 'note' }, 'All phases of this boot, including the sign-in screen wait (hatched). Segment labels appear only where they fit; hover for any segment.'));
    } else {
      host.append(el('p', { class: 'empty' }, 'No timeline for this boot – the logon event logs had already rolled over before it was collected.'));
    }

    var appTyp = typicalMap(list, function (x) { return x.logon && arr(x.logon.startupApps).map(function (a) { return { name: a.name, durMs: a.durMs }; }); });
    var apps = arr(lg.startupApps).map(function (a) { return { name: a.name, ms: a.durMs, title: a.command, small: a.kind === 'packaged' ? 'packaged app' : null }; }).slice(0, 12);
    var batches = arr(lg.startupBatches).filter(function (x) { return x.durMs > 0; });
    var appsCard = rankCard('Startup apps', 'Time Windows spent launching each Run-key command and packaged startup task' + (batches.length ? ' (' + batches.length + ' Run key' + (batches.length > 1 ? 's' : '') + ', ' + fmt(sumBy(batches, function (x) { return x.durMs; })) + ' total)' : '') + '.', apps, 'p-logonTasks', appTyp, 'No startup-app events for this boot.');
    var sp = arr(lg.shellPhases).filter(function (p) { return p.durMs > 0; }).map(function (p) { return { name: p.name, ms: p.durMs }; }).sort(function (a, c) { return c.ms - a.ms; }).slice(0, 8);
    var spTyp = typicalMap(list, function (x) { return x.logon && arr(x.logon.shellPhases); });
    var spCard = rankCard('Shell phases', 'Explorer and desktop initialisation. Long background phases (such as startup apps) don’t necessarily block the desktop.', sp, 'p-logonTasks', spTyp, 'No shell-phase events for this boot.');

    host.append(el('div', { class: 'grid cards' }, waterfallCard(b), policyCard(b, list), mdmCard(b), imeCard(b, list), winlogonCard(b, list),
      ganttCard(b, list), appsCard, spCard, perfCard(b), degradersCard(b), shutdownCard(b), issuesCard(b)));
  }

  // ------------------------------------------------------------------ typical times across boots
  var TYP = {
    phases: ['Boot phases', function (b) { return PHASES.map(function (p) { return { name: p.label, ms: phaseMs(b, p.key) || null }; }); }],
    gp: ['Group Policy extensions', function (b) { return arr(b.policy && b.policy.runs).reduce(function (a, r) { return a.concat(arr(r.extensions).map(function (e) { return { name: (r.scope === 'machine' ? 'Computer · ' : 'User · ') + e.name, ms: e.ms }; })); }, []); }],
    winlogon: ['Winlogon subscribers', function (b) { return arr(b.winlogon).filter(function (w) { return WINLOGON_SHOWN[w.event]; }).map(function (w) { return { name: w.subscriber + ' · ' + w.eventName, ms: w.durMs }; }); }],
    tasks: ['Logon tasks', function (b) { return arr(b.logon && b.logon.tasks).map(function (t) { return { name: t.name, ms: t.durMs }; }); }],
    apps: ['Startup apps', function (b) { return arr(b.logon && b.logon.startupApps).map(function (t) { return { name: t.name, ms: t.durMs }; }); }],
    ime: ['Intune scripts and apps', function (b) { return arr(b.ime && b.ime.units).map(function (u) { return { name: imeName(u), ms: u.durMs }; }); }],
    mdm: ['Intune MDM syncs', function (b) { return arr(b.mdm && b.mdm.sessions).map(function (s) { return { name: 'MDM sync session', ms: s.durMs }; }); }],
    degraders: ['Boot degraders', function (b) { return arr(b.degraders).map(function (d) { return { name: d.kind + ': ' + d.name, ms: d.degradationMs }; }); }]
  };
  function renderTypical(list) {
    var host = $('typical'); host.replaceChildren();
    var sel = el('select', { id: 'typ-sel', 'aria-label': 'Category' });
    Object.keys(TYP).forEach(function (k) { sel.append(el('option', { value: k }, TYP[k][0])); });
    sel.value = state.typ;
    sel.onchange = function () { state.typ = sel.value; renderTypical(visible()); };
    host.append(el('div', { class: 'cardhead' },
      el('div', null, el('h2', { id: 'typ-h' }, 'Typical times across boots'), el('p', { class: 'sub' }, 'Median, 90th percentile and worst case for each item over the ' + list.length + ' boots in view – the per-item breakdown Intune’s totals don’t show.')),
      el('div', { class: 'ctl' }, el('label', { for: 'typ-sel' }, 'Show'), sel)));
    var acc = {};
    list.forEach(function (b) {
      var seen = {};
      TYP[state.typ][1](b).forEach(function (i) {
        if (!isNum(i.ms)) return;
        var a = acc[i.name] = acc[i.name] || { v: [], boots: 0, worst: null };
        a.v.push(i.ms);
        if (!seen[i.name]) { a.boots++; seen[i.name] = 1; }
        if (!a.worst || i.ms > a.worst.ms) a.worst = { ms: i.ms, b: b };
      });
    });
    var rowsData = Object.keys(acc).map(function (k) { var a = acc[k]; return { name: k, boots: a.boots, med: median(a.v), p90: pct(a.v, 0.9), worst: a.worst }; })
      .sort(function (a, c) { return (c.p90 || 0) - (a.p90 || 0); }).slice(0, 40);
    if (!rowsData.length) { host.append(el('p', { class: 'empty' }, 'No data of this kind in the boots in view.')); return; }
    var table = el('table', null, el('thead', null, el('tr', null, ['Item', 'Boots', 'Median', 'P90', 'Worst', 'Worst boot'].map(function (h, i) { return el('th', { scope: 'col', style: i === 1 ? 'text-align:right' : null }, h); }))));
    var body = el('tbody');
    rowsData.forEach(function (r) {
      body.append(el('tr', null, el('td', { class: 'l' }, r.name), el('td', null, String(r.boots)), el('td', null, fmt(r.med)), el('td', null, fmt(r.p90)), el('td', null, fmt(r.worst.ms)),
        el('td', null, el('button', { class: 'link', type: 'button', onclick: function () { state.selected = r.worst.b.id; update(); $('detail').scrollIntoView({ behavior: 'smooth' }); } }, dateLong(r.worst.b.bootStartMs)))));
    });
    table.append(body);
    host.append(el('div', { class: 'tablewrap' }, table));
  }

  // ------------------------------------------------------------------ table
  var COLS = [['Boot', function (b) { return dateLong(b.bootStartMs); }, function (b) { return new Date(b.bootStartMs).toISOString(); }],
    ['Type', function (b) { return bootTypeName(b.bootType); }],
    ['Firmware + loader', 't', function (t) { return isNum(t.firmwareMs) ? t.firmwareMs + (t.loaderMs || 0) : null; }],
    ['Start → sign-in screen', 't', 'coreBootMs'], ['Sign-in wait', 't', 'signInWaitMs'],
    ['Auth', 't', 'authMs'], ['Profile', 't', 'profileMs'],
    ['Computer policy (blocking)', 't', 'machinePolicyMs'], ['Computer policy (total)', 't', 'machinePolicyTotalMs'],
    ['User policy (blocking)', 't', 'userPolicyMs'], ['User policy (total)', 't', 'userPolicyTotalMs'],
    ['Logon tasks', 't', 'logonTasksMs'], ['Sign-in → ready', 't', 'signInToReadyMs'],
    ['Ready (excl. wait)', 't', 'readyExclWaitMs'], ['Power-on → ready', 't', 'powerOnToReadyMs'],
    ['Network', 't', 'networkMs'], ['MDM settings', 'n', 'mdmPolicies'], ['Problems', 'c']];
  function colValue(c, b) {
    var t = b.totals || {};
    if (c[1] === 't') return typeof c[2] === 'function' ? c[2](t) : t[c[2]];
    if (c[1] === 'n') return t[c[2]];
    if (c[1] === 'c') return arr(b.issues).length;
    return null;
  }
  function renderTable(list) {
    var table = $('table'); table.replaceChildren();
    table.append(el('thead', null, el('tr', null, COLS.map(function (c) { return el('th', { scope: 'col' }, c[0]); }))));
    var body = el('tbody');
    list.slice().reverse().forEach(function (b) {
      var tr = el('tr', { class: b.id === state.selected ? 'sel' : '', tabindex: 0, onclick: function () { state.selected = b.id; update(); },
        onkeydown: function (e) { if (e.key === 'Enter') { state.selected = b.id; update(); } } },
        COLS.map(function (c) {
          if (typeof c[1] === 'function') return el('td', null, c[1](b));
          var v = colValue(c, b);
          return el('td', null, c[1] === 't' ? fmt(v) : (v == null ? '–' : String(v)));
        }));
      body.append(tr);
    });
    table.append(body);
  }
  function downloadCsv() {
    var list = visible();
    var q = function (s) {
      s = s == null ? '' : String(s);
      if (/^[=+@]/.test(s)) s = "'" + s;                 // never let a cell start a spreadsheet formula
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    var devCols = [['Device', DEV.name], ['Serial', DEV.serial], ['Entra device ID', DEV.entraDeviceId], ['Intune device ID', DEV.intuneDeviceId],
      ['Collected', DATA.collectedMs ? new Date(DATA.collectedMs).toISOString() : null]];
    var devHead = devCols.map(function (c) { return q(c[0]); }), devVals = devCols.map(function (c) { return q(c[1]); });
    var lines = [devHead.concat(COLS.map(function (c) { return q(c[1] === 't' ? c[0] + ' (ms)' : c[0]); })).join(',')];
    list.forEach(function (b) {
      lines.push(devVals.concat(COLS.map(function (c) {
        if (typeof c[1] === 'function') return q(c[2] ? c[2](b) : c[1](b));
        var v = colValue(c, b); return q(isNum(v) ? Math.round(v) : v);
      })).join(','));
    });
    var a = el('a', { href: URL.createObjectURL(new Blob([lines.join('\r\n')], { type: 'text/csv' })), download: 'bootview-' + (DEV.name || 'device') + '.csv' });
    document.body.append(a); a.click(); a.remove();
  }
  $('csv').addEventListener('click', downloadCsv);

  // ------------------------------------------------------------------ update
  function update() {
    var list = visible();
    var inView = list.some(function (b) { return b.id === state.selected; });
    if (!inView) {                                        // default to the newest boot that has timing data
      var pool = charted(list).length ? charted(list) : list;
      state.selected = pool.length ? pool[pool.length - 1].id : null;
    }
    renderFilters();
    renderLegend();
    renderKpis(list);
    drawChart(list);
    renderDetail(list);
    renderTypical(list);
    renderTable(list);
  }

  // ------------------------------------------------------------------ theme
  var themeBtn = $('theme');
  var modes = ['auto', 'light', 'dark'];
  function applyTheme(mode) {
    if (mode === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', mode);
    themeBtn.textContent = 'Theme: ' + mode; themeBtn.dataset.mode = mode;
  }
  var saved = 'auto';
  try { saved = localStorage.getItem('bootview-theme') || 'auto'; } catch (e) { }
  applyTheme(modes.indexOf(saved) >= 0 ? saved : 'auto');
  themeBtn.addEventListener('click', function () {
    var next = modes[(modes.indexOf(themeBtn.dataset.mode) + 1) % modes.length];
    applyTheme(next);
    try { localStorage.setItem('bootview-theme', next); } catch (e) { }
  });

  // redraw the width-dependent parts (SVG chart, strip labels) whenever the container width actually changes
  var lastWidth = 0, resizeTimer;
  function onWidthChange() {
    var w = $('chart').clientWidth;
    if (Math.abs(w - lastWidth) < 2) return;
    lastWidth = w;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { var l = visible(); drawChart(l); renderDetail(l); }, 80);
  }
  if (window.ResizeObserver) new ResizeObserver(onWidthChange).observe($('chart'));
  else window.addEventListener('resize', onWidthChange);

  renderHeader();
  renderNotices();
  update();
})();
</script>
</body>
</html>
